#Spring Data JPA
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false
spring.flyway.enabled=true

#RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

#Security
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}

#MinIO
wonder.minio.endpoint=${MINIO_ENDPOINT}
wonder.minio.access-key=${MINIO_ACCESS_KEY}
wonder.minio.secret-key=${MINIO_SECRET_KEY}
wonder.minio.bucket=${MINIO_BUCKET:wonder-fotos-usuarios}

# Keycloak Admin API
wonder.keycloak.server-url=${KEYCLOAK_SERVER_URL:http://localhost:8081}
wonder.keycloak.realm=${KEYCLOAK_REALM:wonder}
wonder.keycloak.client-id=${KEYCLOAK_CLIENT_ID:wonder-core}
wonder.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:}
wonder.keycloak.connect-timeout=${KEYCLOAK_CONNECT_TIMEOUT:3s}
wonder.keycloak.read-timeout=${KEYCLOAK_READ_TIMEOUT:5s}
