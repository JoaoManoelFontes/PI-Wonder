#Spring Data JPA
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:wonder_db}
spring.datasource.username=${POSTGRES_USER:wonder}
spring.datasource.password=${POSTGRES_PASSWORD:wonder}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.flyway.enabled=true

#RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:wonder}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:s3cr3t!}

#Security
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/wonder}

#MinIO
wonder.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
wonder.minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
wonder.minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
wonder.minio.bucket=${MINIO_BUCKET:wonder-fotos-usuarios}

# Keycloak Admin API
wonder.keycloak.server-url=${KEYCLOAK_SERVER_URL:http://localhost:8081}
wonder.keycloak.realm=${KEYCLOAK_REALM:wonder}
wonder.keycloak.client-id=${KEYCLOAK_CLIENT_ID:wonder-core}
wonder.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:}
wonder.keycloak.connect-timeout=${KEYCLOAK_CONNECT_TIMEOUT:3s}
wonder.keycloak.read-timeout=${KEYCLOAK_READ_TIMEOUT:5s}
