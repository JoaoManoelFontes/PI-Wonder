spring.application.name=notification

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties[mail.smtp.auth]=${MAIL_SMTP_AUTH:false}
spring.mail.properties[mail.smtp.starttls.enable]=${MAIL_SMTP_STARTTLS_ENABLE:false}
spring.mail.properties[mail.smtp.starttls.required]=${MAIL_SMTP_STARTTLS_REQUIRED:false}
spring.mail.properties[mail.smtp.connectiontimeout]=${MAIL_CONNECTION_TIMEOUT:5000}
spring.mail.properties[mail.smtp.timeout]=${MAIL_READ_TIMEOUT:5000}
spring.mail.properties[mail.smtp.writetimeout]=${MAIL_WRITE_TIMEOUT:5000}
wonder.email.remetente=${MAIL_FROM:nao-responda@wonder.local}
# Mensagens inválidas ou com falha de SMTP seguem para a DLQ da respectiva fila.
spring.rabbitmq.listener.simple.default-requeue-rejected=false
