spring.application.name=worker

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.default-requeue-rejected=false

wonder.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
wonder.minio.public-endpoint=${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
wonder.minio.access-key=${MINIO_ACCESS_KEY}
wonder.minio.secret-key=${MINIO_SECRET_KEY}
wonder.minio.export-bucket=${MINIO_EXPORT_BUCKET:wonder-exportacoes}
wonder.minio.link-ttl-horas=${EXPORTACAO_LINK_TTL_HORAS:24}
